title: 'Planting tulips and alliums in October'
excerpt: 'October is the month for tulips and alliums. How deep, how many and where, and why we plant ours later than the packet says.'
category: advice
body: |-
  Bulb catalogues start arriving in August, and it is tempting to plant everything the day the parcel lands. For most bulbs that is fine. For tulips and alliums, a little patience pays.

  ## Alliums first

  Alliums go in from late September to the end of October, while the soil is still warm. Plant them three times as deep as the bulb is tall, which for the big drumstick kinds means about fifteen centimetres.

  - Plant in groups of seven or more, in sun.
  - Weave them through grasses and later perennials, which hide the leaves as they die back in June.
  - Leave the seedheads standing. They are as good in August as the flowers were in May.

  ## Tulips last

  We plant tulips at the end of October, or even in November. Cold soil keeps tulip fire, a fungal disease, at bay, and the bulbs lose nothing by waiting.

  Plant them deep, at least twenty centimetres, and they are far more likely to come back the following year. In pots, use fresh compost every autumn and a layer of grit on top to keep the squirrels guessing.

  ## How many

  More than you think. For a border, we work on about fifty tulips to a square metre for a proper show, fewer if they are mixed with alliums and early perennials.

  If you would like help choosing bulbs for your own garden, we are happy to talk it through on a site walk.
