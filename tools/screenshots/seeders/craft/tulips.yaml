title: 'Planting tulips and alliums in October'
excerpt: 'October is the month for bulbs. Here is how we plant tulips and alliums so they come back, and what to do with them once they have flowered.'
category: seasonal
body: |-
  Every autumn someone asks us whether it is too late to plant bulbs. For tulips and alliums, October is not late at all. It is just right.

  Here is how we go about it.

  ## Alliums first

  Alliums want planting as soon as the soil has cooled a little, from late September into October. Plant them about 15 centimetres deep, in groups of five or seven, through the middle of a border rather than along the front. *Allium* 'Purple Sensation' is the one we use most: tall, reliable and happy in most soils.

  Leave the seed heads standing after they flower. They look good well into winter, and the bees have no complaints.

  ## Tulips at the end of the month

  Tulips are better planted late, once the soil is properly cold, which in Northumberland usually means the last week of October or the first of November. Planting late helps keep tulip fire at bay.

  - **Plant deep.** About 20 centimetres, three times the height of the bulb. Deep bulbs come back more reliably.
  - **Plant in pots if your soil is heavy.** Terracotta pots with plenty of grit, and the bulbs almost touching.
  - **Feed after flowering.** A liquid feed while the leaves are green builds next year's flower.

  ## A note on squirrels

  They will dig up a freshly planted pot within the hour. A piece of chicken wire over the top for the first month saves a lot of bad language.

  > Plant more than you think you need. You will not regret it in April.

  If you would like help planning a bulb scheme for next spring, get in touch.
